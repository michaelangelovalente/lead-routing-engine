spring:
  application:
    name: lead-routing-engine
  datasource:
    url: jdbc:postgresql://localhost:5432/leadrouting
    username: leadrouting
    password: leadrouting
    hikari:
      maximum-pool-size: 10
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

notification:
  failure-rate: 0.0

logging:
  level:
    com.casavo.leadrouting: INFO
