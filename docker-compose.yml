services:
  postgres:
    image: postgres:16-alpine
    container_name: leadrouting-postgres
    environment:
      POSTGRES_DB: leadrouting
      POSTGRES_USER: leadrouting
      POSTGRES_PASSWORD: leadrouting
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leadrouting -d leadrouting"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
